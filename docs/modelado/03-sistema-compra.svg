<text x="845.0" y="699.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">CUS-09 comprueba negocio aprobado, producto publicado, plazo y stock.</text>
<text x="845.0" y="721.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">CUS-08 reserva stock y registra pedido PENDIENTE.</text>
