<text x="840.0" y="942.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Fuera del sistema: el cliente decide abrir WhatsApp y enviar el mensaje.</text>
<text x="840.0" y="964.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">YAPAA no verifica el envío, el pago ni la entrega mediante la API de WhatsApp.</text>
