<text x="645.0" y="465.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Cuenta nueva NEGOCIO, distinta de CLIENTE.</text>
<text x="645.0" y="487.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Razón social consultada; afiliación pendiente de</text>
<text x="645.0" y="509.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">aprobación.</text>
<text x="645.0" y="531.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Plan Promocional asignado al registro.</text>
<rect x="940" y="880" width="370" height="170" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="1125.0" y="927.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Comisión única por PedidoNegocio.</text>
<text x="1125.0" y="949.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Base = subtotal de productos.</text>
<text x="1125.0" y="971.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Tasa = plan vigente al confirmar.</text>
<text x="1125.0" y="993.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">El delivery no integra la base.</text>
<text x="1125.0" y="1015.0" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Confirmar dos veces no duplica.</text>
<rect x="360" y="1200" width="890" height="115" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="805.0" y="1252.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Cancelar antes de concretar: devuelve stock una vez; sin comisión.</text>
<text x="805.0" y="1274.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#172b3a">Una venta COMPLETADA no se cancela mediante este flujo.</text>
