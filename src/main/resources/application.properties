spring.application.name=yapaa-api

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=YAPAA_BD;encrypt=true;trustServerCertificate=true;connectRetryCount=3;connectRetryInterval=10
spring.datasource.username=sa
spring.datasource.password=${YAPAA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

yapaa.jwt.secreto=${YAPAA_JWT_SECRET:}
yapaa.jwt.expiracion-ms=86400000

# Cuentas de demostracion del entorno local.
yapaa.demo.habilitado=true

# Clave del proveedor RUC: se configura como variable de entorno, nunca en Angular.
yapaa.ruc.token=${YAPAA_RUC_TOKEN:}
yapaa.demo.intervalo-ms=30000


yapaa.admin.correo=${YAPAA_ADMIN_EMAIL:admin@admin.com}
yapaa.admin.clave=${YAPAA_ADMIN_PASSWORD:}
yapaa.correo.modo=${YAPAA_MAIL_MODE:local}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${YAPAA_MAIL_USER:}
spring.mail.password=${YAPAA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
spring.config.import=optional:file:./config/ruc-local.properties,optional:file:./config/app-local.properties,optional:file:./config/correo-local.properties
