spring.application.name=yapaa-api

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=YAPAA_BD;encrypt=true;trustServerCertificate=true;connectRetryCount=3;connectRetryInterval=10
spring.datasource.username=sa
spring.datasource.password=${YAPAA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

yapaa.jwt.secreto=${YAPAA_JWT_SECRET:}
yapaa.jwt.expiracion-ms=86400000

# Cuentas de demostracion del entorno local.
yapaa.demo.habilitado=true

# Clave del proveedor RUC: se configura como variable de entorno, nunca en Angular.
yapaa.ruc.token=${YAPAA_RUC_TOKEN:}
yapaa.demo.intervalo-ms=30000

spring.config.import=optional:file:./config/ruc-local.properties,optional:file:./config/app-local.properties,optional:file:./config/app-local.properties
